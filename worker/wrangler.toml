name = "visa-advisor"
main = "src/index.js"
compatibility_date = "2025-09-23"

[vars]
LLM_ENDPOINT  = "https://api.minimax.io/v1/responses"
LLM_MODEL     = "MiniMax-M3"
ALLOWED_ORIGIN = "https://sopetine.github.io"
SEARCH_PROVIDER        = "tavily"
SEARCH_QUERIES_PER_RUN = "7"

[[ratelimits]]
name = "VISA_ADVISOR_LIMITER"
namespace_id = "819873423160101"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets (run `wrangler secret put LLM_API_KEY` and `wrangler secret put TAVILY_API_KEY`):
# LLM_API_KEY
# TAVILY_API_KEY
